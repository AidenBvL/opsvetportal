{% extends "base.html" %}
{% block content %}
<div class="card mx-auto" style="max-width:560px"><div class="card-body p-4">
  <div class="d-flex gap-3"><span class="kpi-icon danger"><i class="bi bi-trash"></i></span>
  <div><h5>{{ verbose_name|capfirst }} verwijderen?</h5>
  <p class="text-body-secondary"><strong>{{ object }}</strong> wordt definitief verwijderd. Dit kan niet ongedaan worden gemaakt.</p>
  <form method="post" class="d-flex gap-2">{% csrf_token %}<button class="btn btn-danger">Ja, verwijderen</button> <a href="{{ list_url }}" class="btn btn-outline-secondary">Annuleren</a></form></div></div>
</div></div>
{% endblock %}
