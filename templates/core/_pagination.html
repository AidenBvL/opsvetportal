{% load portal %}
{% if is_paginated %}
<nav class="mt-3 d-flex align-items-center gap-2" aria-label="Pagina's">
  <ul class="pagination pagination-sm mb-0">
    {% if page_obj.has_previous %}<li class="page-item"><a class="page-link" href="{% querystring_with page=page_obj.previous_page_number %}" aria-label="Vorige">‹</a></li>{% endif %}
    <li class="page-item disabled"><span class="page-link">{{ page_obj.number }} / {{ paginator.num_pages }}</span></li>
    {% if page_obj.has_next %}<li class="page-item"><a class="page-link" href="{% querystring_with page=page_obj.next_page_number %}" aria-label="Volgende">›</a></li>{% endif %}
  </ul>
  <span class="small text-body-secondary">{{ paginator.count }} in totaal</span>
</nav>
{% endif %}
